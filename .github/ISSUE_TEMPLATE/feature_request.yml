name: Feature request
description: Suggest an idea for Perqora.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What's missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
