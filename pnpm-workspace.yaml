overrides:
  # deepmerge-ts <8.0.0 has a stack-exhaustion DoS on recursive object graphs
  # (GHSA-ggr8-5vv4-36mx), pulled in transitively via prisma > @prisma/config.
  # It's used only in Prisma's own CLI/config loading, never on a path that
  # touches attacker-supplied HTTP input, but pinning the fixed version costs
  # nothing and clears the Dependabot alert.
  deepmerge-ts: ">=8.0.0"

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "unrs-resolver"
  - "esbuild"
